<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    :root { color-scheme: dark; --header-height: 52px; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; background: #101c25; color: #e8eef2; font: 14px/1.4 system-ui, sans-serif; overflow-x: hidden; }
    header { height: var(--header-height); display: flex; align-items: center; gap: 12px; padding: 8px 14px; background: #142630; border-bottom: 1px solid #3c505b; }
    header strong { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #load-status { margin-left: auto; white-space: nowrap; color: #becfd9; font-variant-numeric: tabular-nums; }
    button { flex: none; min-height: 32px; border: 1px solid #7d9dab; border-radius: 5px; padding: 4px 10px; color: #eff7f7; background: #263e49; font: inherit; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    button:focus-visible, canvas:focus-visible { outline: 2px solid #efb069; outline-offset: -2px; }
    #unity-container { position: relative; width: 100%; height: calc(100vh - var(--header-height)); height: calc(100dvh - var(--header-height)); min-height: 0; }
    #unity-canvas { display: block; width: 100%; height: 100%; background: #101c25; }
    #unity-canvas:fullscreen { width: 100vw; height: 100vh; }
    #loading { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(340px, 85%); text-align: center; pointer-events: none; }
    progress { display: block; width: 100%; height: 12px; margin-top: 12px; accent-color: #efb069; }
    #unity-warning { position: absolute; top: 12px; left: 12px; right: 12px; max-height: 40%; overflow: auto; }
    #unity-warning:empty { display: none; }
    #unity-warning p { margin: 0 0 6px; padding: 10px; background: #4c2d19; color: #fff0df; overflow-wrap: anywhere; }
    @media (max-width: 560px) { header { gap: 8px; padding: 8px; } header strong { font-size: 12px; } button { padding: 4px 7px; } }
  </style>
</head>
<body>
  <header><strong>Unity Engineering Lab</strong><span id="load-status" role="status">Loading 0%</span><button id="fullscreen" type="button" disabled>Full screen</button></header>
  <main id="unity-container">
    <canvas id="unity-canvas" width="{{{ WIDTH }}}" height="{{{ HEIGHT }}}" tabindex="0" aria-label="Playable Unity engineering scenarios"></canvas>
    <div id="loading">Preparing the native scenarios<progress id="load-progress" max="1" value="0"></progress></div>
    <div id="unity-warning" role="alert"></div>
  </main>
  <script>
    // Unity 6000.5 loader contract, based on the installed Default template.
    // Match render pixels to CSS pixels so the native minimum-size HUD stays readable.
    var canvas = document.getElementById("unity-canvas");
    var loadStatus = document.getElementById("load-status");
    var progress = document.getElementById("load-progress");
    var loading = document.getElementById("loading");
    var fullscreen = document.getElementById("fullscreen");
    function showBanner(message, type) {
      var entry = document.createElement("p");
      entry.textContent = message;
      document.getElementById("unity-warning").appendChild(entry);
      if (type !== "error") setTimeout(function () { entry.remove(); }, 7000);
    }
    var buildUrl = "Build";
    var config = {
      arguments: [],
      dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
      frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
      codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      devicePixelRatio: 1,
      matchWebGLToCanvasSize: true,
      showBanner: showBanner
    };
    var script = document.createElement("script");
    script.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
    script.onerror = function () { loadStatus.textContent = "Load failed"; loading.hidden = true; showBanner("The Unity loader could not be loaded. Check the export and HTTP server.", "error"); };
    script.onload = function () {
      createUnityInstance(canvas, config, function (value) {
        progress.value = value;
        loadStatus.textContent = "Loading " + Math.round(value * 100) + "%";
      }).then(function (instance) {
        loading.hidden = true;
        loadStatus.textContent = "Ready";
        fullscreen.disabled = false;
        fullscreen.onclick = function () { instance.SetFullscreen(1); };
        canvas.addEventListener("pointerdown", function () { canvas.focus({ preventScroll: true }); });
      }).catch(function (message) {
        loading.hidden = true;
        loadStatus.textContent = "Load failed";
        showBanner(String(message), "error");
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
